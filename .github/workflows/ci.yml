name: AetherDB CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21', '22' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Run Standalone TestRunner Suite
        run: |
          mkdir -p bin
          javac -d bin $(find src/main/java src/test/java -name "*.java" ! -name "AetherDbJUnitTest.java")
          java -cp bin com.aetherdb.test.TestRunner
