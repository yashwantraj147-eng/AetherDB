# ==============================================================================
# AetherDB - Distributed Key-Value & Columnar Storage Engine Configuration
# ==============================================================================

# Node Identity & Network Configuration
node.id=node-1
node.host=127.0.0.1
node.port=8080
node.cluster.peers=node-1:127.0.0.1:8080,node-2:127.0.0.1:8081,node-3:127.0.0.1:8082

# Storage Engine Directories
storage.data.dir=./data/node-1/storage
storage.wal.dir=./data/node-1/wal
storage.sstable.dir=./data/node-1/sstable
storage.columnar.dir=./data/node-1/columnar

# LSM-Tree Key-Value Engine Parameters
lsm.memtable.max.bytes=33554432
lsm.memtable.flush.queue.capacity=8
lsm.wal.sync.mode=PERIODIC
lsm.wal.periodic.sync.ms=50
lsm.bloom.false.positive.rate=0.01
lsm.sstable.block.size=65536
lsm.compaction.min.threshold=4
lsm.compaction.max.threshold=16

# Columnar Analytics Engine Parameters
columnar.chunk.max.rows=65536
columnar.compression.codec=AUTO
columnar.dictionary.threshold.ratio=0.70
columnar.vectorized.batch.size=1024

# Raft Consensus Engine Parameters
raft.election.timeout.min.ms=150
raft.election.timeout.max.ms=300
raft.heartbeat.interval.ms=50
raft.max.entries.per.request=500

# Consistent Hashing Parameters
cluster.vnodes.per.node=64

# Web Dashboard & Monitoring
server.dashboard.enabled=true
server.metrics.history.retention.seconds=3600
